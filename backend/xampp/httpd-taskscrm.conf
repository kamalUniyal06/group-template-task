# SugarCRM (Taskflow backend) runs on PHP 7.4 via FastCGI.
# Start the PHP 7.4 worker with C:\xampp\php74\start-taskscrm-php.bat
<LocationMatch "^/taskscrm/.*\.php(/.*)?$">
    SetHandler "proxy:fcgi://127.0.0.1:9074/"
    ProxyFCGISetEnvIf "reqenv('SCRIPT_FILENAME') =~ m|^proxy:fcgi://[^/]+/(.*)$|" SCRIPT_FILENAME "$1"
    ProxyFCGISetEnvIf "reqenv('SCRIPT_FILENAME') =~ m|^/([A-Za-z]:/.*)$|" SCRIPT_FILENAME "$1"
</LocationMatch>
<Directory "C:/xampp/htdocs/taskscrm">
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
</Directory>
ProxyTimeout 300
